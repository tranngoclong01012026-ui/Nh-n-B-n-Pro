# Workflow build APK từ file ZIP đã tải lên repo (không cần giải nén trên điện thoại).
# Cách dùng: tải file Nhan-Ban-Pro-v2.1-Sua-BlackBox.zip lên repo, rồi tạo file
# .github/workflows/build-apk.yml trong repo và dán toàn bộ nội dung file này vào.
name: Build NhanBanPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 29.0.13846066
        run: sdkmanager "ndk;29.0.13846066" "platforms;android-36" "build-tools;36.0.0"

      - name: Unzip source
        run: unzip -o Nhan-Ban-Pro-v2.1-Sua-BlackBox.zip -d source && ls source

      - name: Build debug APK
        working-directory: source
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NhanBanPro-v2.1.0-debug
          path: source/app/build/outputs/apk/debug/app-debug.apk
